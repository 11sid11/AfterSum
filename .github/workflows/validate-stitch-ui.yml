name: Validate Stitch UI adaptation

on:
  push:
    branches: [agent/stitch-safe-ui-adaptation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit nonstandard visual utilities
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          safe_alpha = {0, 5, 10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 95, 100}
          alpha_pattern = re.compile(r'(?:bg|text|border|ring|divide|from|via|to)-[^\s"\'`]+/(\d{1,3})(?=[\s"\'`])')
          bad = []
          for path in pathlib.Path('src').rglob('*.tsx'):
              text = path.read_text()
              for line_number, line in enumerate(text.splitlines(), 1):
                  for match in alpha_pattern.finditer(line):
                      if int(match.group(1)) not in safe_alpha:
                          bad.append(f'{path}:{line_number}: use bracket alpha for {match.group(0)}')
                  if 'ring-3' in line:
                      bad.append(f'{path}:{line_number}: ring-3 is not a default Tailwind width')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          PY
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE_PATH: /AfterSum/
